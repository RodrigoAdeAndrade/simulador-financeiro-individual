<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Financeira</title>
</head>

<body>
    <h1>Simulador Financeiro</h1>
    <h3>Potencial prejuízo com o mal gerencimento da capacidade dos silos</h3>
    Selecione o tipo de grão:<br><br>
    <select id="sel_grao">
        <option value="vazio">Selecione um grão</option>
        <option value="arroz">Arroz</option>
        <option value="milho">Milho</option>
        <option value="soja">Soja</option>
    </select><br><br>
    Quantidade de grãos produzidos por mês(TON):
    <input type="text" id="ipt_producao"><br><br>
    Insira a cotação do dólar atual:
    <input type="text" id="ipt_dolar"><br><br>
    <button onclick="calculo()">Calcular</button><br><br>
    <div id="div_exibir"></div>
</body>
<script>
    function calculo() {
        let tipo_grao = sel_grao.value;
        let producao = Number(ipt_producao.value);
        let capacidade = producao * 0.65;
        let comprometido = producao * 0.35
        let preco_ton_soja = 2000;
        let preco_ton_milho = 1000;
        let preco_ton_arroz = 1750;
        let vl_produzido;
        let vl_comprometido;
        let cot_dolar = Number(ipt_dolar.value);

        if (tipo_grao == 'vazio') {
            alert('ERRO: Selecione um grão para seguir com a simulação.')
        } else {
            if (producao == '') {
                div_exibir.innerHTML = `<b>ERRO: Digite um valor para a produção.</b>`
            } else if (producao <= 0) {
                div_exibir.innerHTML = `<b>ERRO: Digite um valor maior que 0.</b>`
            } else {
                if (tipo_grao == 'arroz') {
                    vl_produzido = producao * preco_ton_arroz;
                    vl_comprometido = comprometido * preco_ton_arroz;
                } else if (tipo_grao == 'milho') {
                    vl_produzido = producao * preco_ton_milho;
                    vl_comprometido = comprometido * preco_ton_milho;
                } else {
                    vl_produzido = producao * preco_ton_soja;
                    vl_comprometido = comprometido * preco_ton_soja;
                }
            }
        }
        div_exibir.innerHTML =
        `<b>Valor total produzido:</b><br> 
        R$ ${vl_produzido.toFixed(2)}<br><br>
        
        <b>Valor produzido em Dólar:</b><br> 
        $ ${(vl_produzido / cot_dolar).toFixed(2)}<br><br>

        <b>Capacidade com destino de armazenamento:</b><br> 
        65% — ${capacidade.toFixed(2)} TON<br><br> 

        <b>Produção comprometida:</b><br> 
        35% — ${comprometido.toFixed(2)} TON<br><br> 
         
        <b>Valor comprometido em Real:</b><br> 
        R$ ${vl_comprometido.toFixed(2)}<br><br> 
        
        <b>Valor comprometido em Dólar:</b><br> 
        $ ${(vl_comprometido / cot_dolar).toFixed(2)}`;

    }
</script>

</html>
